<style>
*{box-sizing:border-box}
html,body{

}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#tag{

 background:#101722cc;border:1px solid #ffffff35;

}
#fps{

 -webkit-user-select:none
}

 border-radius:50%;background:#101722bb;

}

}
#steeringWheel .wheelSpoke.left{transform:translate(-50%,0) rotate(-48deg)}
#steeringWheel .wheelSpoke.right{transform:translate(-50%,0) rotate(48deg)}
#steeringWheel .wheelSpoke.center{

 background:#77dfff;border-radius:5px
}

}

}

}

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';

/* ---------------- CONFIGURATION ---------------- */

const AREA_WIDTH=26;
const AREA_LENGTH=42;
const HEIGHT=4;
const FLOOR_SPACING=4.2;
const FLOOR_COUNT=11;
const LIFT_X=0;
const LIFT_Z=19.3;

let floorLevel=0;
let buildingLevel=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const deckLabel=deck=>deck===0?'R':String(deck);

/* ---------------- RENDERER ---------------- */

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio||1,1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;

document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xaedcf5);
scene.fog=new THREE.Fog(0xaedcf5,55,125);

const camera=new THREE.PerspectiveCamera(
 72,innerWidth/innerHeight,0.08,220
);

camera.position.set(0,1.62,-27);
const playerPosition=camera.position.clone();
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xf2f9ff,0x8b9b88,2.6));

const daylight=new THREE.DirectionalLight(0xfff6df,3.2);
daylight.position.set(-35,60,-25);
scene.add(daylight);

const spawnLight=new THREE.PointLight(0xa8cfff,38,16,1.7);
spawnLight.position.set(0,2.5,1);
scene.add(spawnLight);

const mainLight=new THREE.PointLight(0x8ebaff,34,20,1.8);
mainLight.position.set(0,3,-3);
scene.add(mainLight);

const rearLight=new THREE.PointLight(0x5b83df,20,16,1.8);
rearLight.position.set(0,2.8,-13);
scene.add(rearLight);

/* ---------------- MATERIALS ---------------- */
const wallMat=new THREE.MeshStandardMaterial({
 color:0xccb656,roughness:.95,metalness:.1
});

const floorMat=new THREE.MeshStandardMaterial({
 color:0x8a8579,roughness:1.0,metalness:0
});

const roofMat=new THREE.MeshStandardMaterial({
 color:0xdcdcd0,roughness:.9
});

const trimMat=new THREE.MeshStandardMaterial({
 color:0x4a4535,metalness:.2,roughness:.8
});

const lampMat=new THREE.MeshStandardMaterial({
 color:0xfffbe6,emissive:0xfffbe6,emissiveIntensity:3.0
});

const blueprintTrim=new THREE.MeshStandardMaterial({
 color:0x52b8d2,emissive:0x123c55,
 metalness:.45,roughness:.35
});

const solidWallsByLevel=Array.from(
 {length:FLOOR_COUNT},()=>[]
);
const wallGeometryChunks=new Map();
const deckRenderableMeshes=Array.from({length:FLOOR_COUNT},()=>[]);
const floorSlabMeshes=[];
const corridorLights=[];

for(const z of [-18,18]){
 const light=new THREE.PointLight(0xb6d7ff,26,32,1.7);
 light.position.set(0,3.1,z);
 scene.add(light);
 corridorLights.push(light);
}

/* ---------------- BUILDING ---------------- */

function wall(x,y,z,w,h,d,material=wallMat,solid=true){
 const geometry=new THREE.BoxGeometry(w,h,d);
 geometry.translate(x,buildingLevel*FLOOR_SPACING+y,z);
 geometry.userData.deck=buildingLevel;

 const chunkX=Math.floor((x+AREA_WIDTH/2)/12);
 const chunkZ=Math.floor((z+AREA_LENGTH/2)/12);
 const key=`${buildingLevel}:${chunkX}:${chunkZ}`;

 if(!wallGeometryChunks.has(key)){
  wallGeometryChunks.set(key,[]);
 }
 wallGeometryChunks.get(key).push(geometry);

 if(solid){
  solidWallsByLevel[buildingLevel].push({
   x,y,z,w,d,h
  });
 }

 return geometry;
}

function buildWallChunks(){
 for(const geometries of wallGeometryChunks.values()){
  const positions=[];
  const normals=[];
  const uvs=[];
  const indices=[];
  let vertexOffset=0;

  for(const geometry of geometries){
   positions.push(...geometry.attributes.position.array);
   normals.push(...geometry.attributes.normal.array);
   uvs.push(...geometry.attributes.uv.array);

   const sourceIndices=geometry.index.array;
   for(const index of sourceIndices){
    indices.push(index+vertexOffset);
   }

   vertexOffset+=geometry.attributes.position.count;
   geometry.dispose();
  }

  const merged=new THREE.BufferGeometry();
  merged.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  merged.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  merged.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  merged.setIndex(indices);
  merged.computeBoundingSphere();

  const deck=Number(geometries[0].userData.deck);
  const mesh=new THREE.Mesh(merged,wallMat);
  mesh.userData.deck=deck;
  deckRenderableMeshes[deck].push(mesh);
  scene.add(mesh);
 }
 wallGeometryChunks.clear();
}

function buildBuilding(){

 const halfWidth=AREA_WIDTH/2;
 const halfLength=AREA_LENGTH/2;
 const hallHalf=2.2;
 const roomCount=5;
 const roomLength=AREA_LENGTH/roomCount;

 const instanceTransform=new THREE.Object3D();

 for(let level=0;level<FLOOR_COUNT;level++){

  buildingLevel=level;
  const baseY=level*FLOOR_SPACING;

  // Keep each deck in its own mesh so the camera frustum can cull floors above/below.
  const floors=new THREE.InstancedMesh(
   new THREE.BoxGeometry(AREA_WIDTH,.18,AREA_LENGTH),floorMat,1
  );
  const roofs=new THREE.InstancedMesh(
   new THREE.BoxGeometry(AREA_WIDTH,.15,AREA_LENGTH),roofMat,1
  );
  const doorLines=new THREE.InstancedMesh(
   new THREE.BoxGeometry(.045,.035,2.4),
   blueprintTrim,roomCount*2
  );
  let doorLineIndex=0;

  instanceTransform.position.set(0,baseY-.09,0);
  instanceTransform.updateMatrix();
  floors.setMatrixAt(0,instanceTransform.matrix);

  instanceTransform.position.set(0,baseY+HEIGHT+.08,0);
  instanceTransform.updateMatrix();
  roofs.setMatrixAt(0,instanceTransform.matrix);
  // Intermediate roofs overlap the next deck's floor slab and cause z-fighting.
  roofs.count=level===FLOOR_COUNT-1?1:0;

  // Use instancing so the exterior windows add only two draw calls per deck.
  const glassMat=new THREE.MeshBasicMaterial({
   color:0x5cbbef,transparent:true,opacity:.2,
   side:THREE.DoubleSide,depthWrite:false
  });
  const windowFrameMat=new THREE.MeshStandardMaterial({
   color:0x263d55,metalness:.7,roughness:.32,
   emissive:0x102638,emissiveIntensity:.5
  });
  const windowPanes=new THREE.InstancedMesh(
   new THREE.BoxGeometry(.055,3,5.8),glassMat,roomCount*2
  );
  const windowFrames=new THREE.InstancedMesh(
   new THREE.BoxGeometry(1,1,1),windowFrameMat,roomCount*8
  );
  const windowTransform=new THREE.Object3D();
  let paneIndex=0;
  let frameIndex=0;

  for(const side of [-1,1]){
   const outerX=side*(halfWidth-.1);
   wall(outerX,.25,0,.2,.5,AREA_LENGTH);
   wall(outerX,3.7,0,.2,.6,AREA_LENGTH);

   for(let i=0;i<roomCount;i++){
    const center=-halfLength+(i+.5)*roomLength;
    const windowWidth=5.8;
    const pierDepth=(roomLength-windowWidth)/2;

    wall(outerX,2,center-roomLength/2+pierDepth/2,
     .2,3,pierDepth);
    wall(outerX,2,center+roomLength/2-pierDepth/2,
     .2,3,pierDepth);

    const paneX=side*(halfWidth-.13);
    windowTransform.position.set(paneX,baseY+2,center);
    windowTransform.scale.set(1,1,1);
    windowTransform.updateMatrix();
    windowPanes.setMatrixAt(paneIndex++,windowTransform.matrix);

    // The pane remains solid to the player even though it is see-through.
    solidWallsByLevel[level].push({
     x:paneX,y:2,z:center,w:.055,d:windowWidth,h:3
    });

    const frameX=side*(halfWidth-.16);
    const frameParts=[
     [ .09,.12,windowWidth+.16,frameX,baseY+.5,center],
     [ .09,.12,windowWidth+.16,frameX,baseY+3.5,center],
     [ .09,3,.12,frameX,baseY+2,center-windowWidth/2],
     [ .09,3,.12,frameX,baseY+2,center+windowWidth/2]
    ];
    for(const [w,h,d,x,y,z] of frameParts){
     windowTransform.position.set(x,y,z);
     windowTransform.scale.set(w,h,d);
     windowTransform.updateMatrix();
     windowFrames.setMatrixAt(frameIndex++,windowTransform.matrix);
    }
   }
  }

  windowPanes.instanceMatrix.needsUpdate=true;
  windowFrames.instanceMatrix.needsUpdate=true;
  windowPanes.userData.deck=level;
  windowFrames.userData.deck=level;
  deckRenderableMeshes[level].push(windowPanes,windowFrames);
  scene.add(windowPanes,windowFrames);

  /* Reception opens to the exterior; upper decks keep a sealed end wall. */
  if(level===0){
   const entranceWidth=4.2;
   const sideWallWidth=(AREA_WIDTH-entranceWidth)/2;
   wall(-(entranceWidth/2+sideWallWidth/2),HEIGHT/2,
    -halfLength+.1,sideWallWidth,HEIGHT,.2);
   wall(entranceWidth/2+sideWallWidth/2,HEIGHT/2,
    -halfLength+.1,sideWallWidth,HEIGHT,.2);
   wall(0,3.5,-halfLength+.1,entranceWidth,1,.2);

   // Fit the far-end opening tightly around the lift to avoid side gaps.
   const liftOpeningWidth=3.2;
   const liftSideWallWidth=(AREA_WIDTH-liftOpeningWidth)/2;
   wall(-(liftOpeningWidth/2+liftSideWallWidth/2),HEIGHT/2,
    halfLength-.1,liftSideWallWidth,HEIGHT,.2);
   wall(liftOpeningWidth/2+liftSideWallWidth/2,HEIGHT/2,
    halfLength-.1,liftSideWallWidth,HEIGHT,.2);
   wall(0,3.5,halfLength-.1,liftOpeningWidth,1,.2);
  }else{
   const endWindowWidth=5.8;
   const endWindowHeight=2.4;
   const endWindowY=2;
   const endWallZ=[-halfLength+.1,halfLength-.1];

   for(const z of endWallZ){
    const sideWidth=(AREA_WIDTH-endWindowWidth)/2;
    wall(-(endWindowWidth/2+sideWidth/2),HEIGHT/2,z,
     sideWidth,HEIGHT,.2);
    wall(endWindowWidth/2+sideWidth/2,HEIGHT/2,z,
     sideWidth,HEIGHT,.2);
    const windowBottom=endWindowY-endWindowHeight/2;
    const windowTop=endWindowY+endWindowHeight/2;
    wall(0,(windowTop+HEIGHT)/2,z,
     endWindowWidth,HEIGHT-windowTop,.2);
    wall(0,windowBottom/2,z,
     endWindowWidth,windowBottom,.2);

    const paneZ=z+(z<0?.12:-.12);
    const endPane=new THREE.Mesh(
     new THREE.BoxGeometry(endWindowWidth,endWindowHeight,.055),
     glassMat
    );
    endPane.position.set(0,baseY+endWindowY,paneZ);
    endPane.userData.deck=level;
    deckRenderableMeshes[level].push(endPane);
    scene.add(endPane);
    solidWallsByLevel[level].push({
     x:0,y:endWindowY,z:paneZ,
     w:endWindowWidth,d:.055,h:endWindowHeight
    });

    const frameZ=z+(z<0?.16:-.16);
    const endFrameParts=[
     [endWindowWidth+.16,.12,.09,0,baseY+endWindowY-endWindowHeight/2,frameZ],
     [endWindowWidth+.16,.12,.09,0,baseY+endWindowY+endWindowHeight/2,frameZ],
     [.12,endWindowHeight,.09,-endWindowWidth/2,baseY+endWindowY,frameZ],
     [.12,endWindowHeight,.09,endWindowWidth/2,baseY+endWindowY,frameZ]
    ];
    for(const [w,h,d,x,y,framePartZ] of endFrameParts){
     const frame=new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),windowFrameMat
     );
     frame.position.set(x,y,framePartZ);
     frame.userData.deck=level;
     deckRenderableMeshes[level].push(frame);
     scene.add(frame);
    }
   }
  }

  /* Room walls and doorways (the reception deck stays open). */

  if(level>0) for(const side of [-1,1]){

   const boundary=side*hallHalf;
   const roomDepth=halfWidth-hallHalf;

   for(let i=0;i<roomCount;i++){

    const left=-halfLength+i*roomLength;
    const right=left+roomLength;
    const center=(left+right)/2;
    const gap=2.4;

    if(i>0){
     wall(
      side*(hallHalf+roomDepth/2),
      HEIGHT/2,left,
      roomDepth,HEIGHT,.2
     );
    }

    const first=center-gap/2;
    const second=center+gap/2;

    if(first>left){
     wall(
      boundary,HEIGHT/2,
      (left+first)/2,
      .2,HEIGHT,first-left
     );
    }

    if(right>second){
     wall(
      boundary,HEIGHT/2,
      (second+right)/2,
      .2,HEIGHT,right-second
     );
    }

    instanceTransform.position.set(
     boundary+side*.16,baseY+.025,center
    );
    instanceTransform.updateMatrix();
    doorLines.setMatrixAt(doorLineIndex++,instanceTransform.matrix);
   }
  }
  if(level===0)doorLines.count=0;

  if(level===0){
   // Reception counter stays clear of the lift and the far-side exit.
   wall(-6,.52,-11,4.2,1.04,.9);
   wall(-6,1.08,-11,4.5,.12,1.05);
  }

  /* Corridor ceiling lights */

  const strips=new THREE.InstancedMesh(
   new THREE.BoxGeometry(5,.045,.16),lampMat,roomCount
  );
  const stripTransform=new THREE.Object3D();

  for(let i=0;i<roomCount;i++){
   const z=-halfLength+(i+.5)*roomLength;
   stripTransform.position.set(0,baseY+HEIGHT-.07,z);
   stripTransform.updateMatrix();
   strips.setMatrixAt(i,stripTransform.matrix);
  }

  strips.instanceMatrix.needsUpdate=true;
  floors.instanceMatrix.needsUpdate=true;
  roofs.instanceMatrix.needsUpdate=true;
  doorLines.instanceMatrix.needsUpdate=true;

  floorSlabMeshes[level]=floors;
  deckRenderableMeshes[level].push(strips,floors,roofs,doorLines);
  scene.add(strips,floors,roofs,doorLines);
 }

 buildingLevel=0;
}

/* ---------------- LIFT MODEL ---------------- */

const metal=new THREE.MeshStandardMaterial({
 color:0x53677f,metalness:.78,roughness:.27
});

const darkMetal=new THREE.MeshStandardMaterial({
 color:0x172536,metalness:.65,roughness:.34
});

const liftTrim=new THREE.MeshStandardMaterial({
 color:0x78e7ff,emissive:0x1682a8,
 emissiveIntensity:1.5,metalness:.35,roughness:.28
});

const liftGlow=new THREE.MeshStandardMaterial({
 color:0xb9f5ff,emissive:0x42cfff,emissiveIntensity:2.2
});

const liftCar=new THREE.Group();

 // Smooth custom body mesh made from longitudinal rings.
 function makeLoft(stations,material,segments=32){

  const vertices=[];
  const indices=[];

  for(let i=0;i<stations.length;i++){

   const s=stations[i];

   for(let j=0;j<=segments;j++){

    const a=(j/segments)*Math.PI*2;

    const x=Math.cos(a)*s.width;
    const y=s.centerY+Math.sin(a)*s.height;

    vertices.push(x,y,s.z);
   }
  }

  for(let i=0;i<stations.length-1;i++){

   for(let j=0;j<segments;j++){

    const a=i*(segments+1)+j;
    const b=a+segments+1;

    indices.push(a,b,a+1);
    indices.push(a+1,b,b+1);
   }
  }

  // Close front and rear ends.
  const frontCenter=vertices.length/3;
  vertices.push(0,stations[0].centerY,stations[0].z);

  const rear=stations.length-1;
  const rearCenter=vertices.length/3;
  vertices.push(0,stations[rear].centerY,stations[rear].z);

  for(let j=0;j<segments;j++){

   indices.push(frontCenter,j,j+1);

   const base=rear*(segments+1);
   indices.push(rearCenter,base+j+1,base+j);
  }

  const geo=new THREE.BufferGeometry();

  geo.setAttribute(
   'position',
   new THREE.Float32BufferAttribute(vertices,3)
  );

  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh=new THREE.Mesh(geo,material);

  mesh.castShadow=false;
  mesh.receiveShadow=false;

  carGroup.add(mesh);

  return mesh;
 }

let moveX=0,moveY=0,joyId=null;
let carSteering=0,wheelId=null,wheelLastAngle=0,wheelAngle=0;
const maxWheelAngle=Math.PI*1.5;

function pointerWheelAngle(e){
 const r=steeringWheel.getBoundingClientRect();
 return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));
}

function moveStick(e){

 const r=base.getBoundingClientRect();
 const max=r.width*.34;

 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;

 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 moveX=dx/max;
 moveY=dy/max;

 joystickKnob.style.left=`calc(50% + ${dx}px)`;
 joystickKnob.style.top=`calc(50% + ${dy}px)`;
}

base.addEventListener('pointerdown',e=>{
 e.preventDefault();
 e.stopPropagation();

 if(joyId!==null)return;

 joyId=e.pointerId;
 base.setPointerCapture(joyId);
 moveStick(e);
});

window.addEventListener('pointermove',e=>{
 if(e.pointerId!==joyId)return;
 e.preventDefault();
 moveStick(e);
},{passive:false});

function stopJoy(e){

 if(joyId!==null&&(!e||e.pointerId===joyId)){

  joyId=null;
  moveX=0;
  moveY=0;

  joystickKnob.style.left='50%';
  joystickKnob.style.top='50%';
 }
}

window.addEventListener('pointercancel',stopJoy);
base.addEventListener('lostpointercapture',stopJoy);

 e.preventDefault();
 e.stopPropagation();
 if(wheelId!==null)return;
 wheelId=e.pointerId;
 wheelLastAngle=pointerWheelAngle(e);
 steeringWheel.setPointerCapture(wheelId);
});

steeringWheel.addEventListener('pointermove',e=>{
 if(e.pointerId!==wheelId)return;
 e.preventDefault();
 e.stopPropagation();
 const angle=pointerWheelAngle(e);
 let delta=angle-wheelLastAngle;
 if(delta>Math.PI)delta-=Math.PI*2;
 if(delta<-Math.PI)delta+=Math.PI*2;
 wheelLastAngle=angle;
 wheelAngle=clamp(wheelAngle+delta,-maxWheelAngle,maxWheelAngle);
   // A counterclockwise wheel turn (negative screen angle) steers left.
  carSteering=-wheelAngle/maxWheelAngle;
  wheelRotating.style.transform=`rotate(${wheelAngle}rad)`;
});

function releaseSteering(e){
 if(wheelId!==null&&(!e||e.pointerId===wheelId)){
  wheelId=null;
  carSteering=0;

 }
}

function animate(now){

 requestAnimationFrame(animate);

 const dt=Math.min((now-prev)/1000,.1);
 prev=now;

 fpsFrames++;
 fpsElapsed+=dt;
 if(fpsElapsed>=.25){
  fpsDisplay.textContent='FPS: '+Math.round(fpsFrames/fpsElapsed);
  fpsFrames=0;
  fpsElapsed=0;
 }

 /* Position checks */

 const nearLift=
  Math.abs(playerPosition.x-LIFT_X)<2.5&&
  Math.abs(playerPosition.z-LIFT_Z)<3.2;

 const insideLift=
  Math.abs(playerPosition.x-LIFT_X)<1.2&&
  playerPosition.z>LIFT_Z-1.25&&
  playerPosition.z<LIFT_Z+1.55;

 /* Lift doors */

 const targetDoorProgress=(!liftMoving&&nearLift)?1:0;

 liftDoorProgress+=(
  targetDoorProgress-liftDoorProgress
 )*Math.min(1,dt*4.5);

 if(Math.abs(targetDoorProgress-liftDoorProgress)<.005){
  liftDoorProgress=targetDoorProgress;
 }

 for(const door of liftDoorPanels){
  door.group.position.x=
   door.side*(.68+liftDoorProgress*.85);
 }

 /* Lift movement */

 if(liftMoving){

  if(!liftTravelStarted){

   playerPosition.x=clamp(playerPosition.x,LIFT_X-1,LIFT_X+1);
   playerPosition.z=LIFT_Z;

   if(liftDoorProgress<=.005){
    liftTravelStarted=true;
    liftElapsed=0;
   }

  }else{

   liftElapsed+=dt;

   const progress=clamp(liftElapsed/3.2,0,1);
   const eased=progress*progress*(3-2*progress);

   liftOffset=(
    (liftDestination-liftSource)*FLOOR_SPACING*eased
   );

   liftCar.position.y=
    liftSource*FLOOR_SPACING+liftOffset;

   if(progress>=1){

    floorLevel=liftDestination;
    liftOffset=0;
    liftMoving=false;
    liftTravelStarted=false;

    liftCar.position.y=floorLevel*FLOOR_SPACING;
   }
  }
 }

 for(const light of corridorLights){
  light.position.y=floorLevel*FLOOR_SPACING+liftOffset+3.1;
 }

 let shownFloor=floorLevel;

 if(liftMoving&&liftTravelStarted){

  const progress=clamp(liftElapsed/3.2,0,1);
  const eased=progress*progress*(3-2*progress);

  shownFloor=Math.round(
   liftSource+(liftDestination-liftSource)*eased
  );
 }

 updateTravelDisplay(deckLabel(shownFloor));

 /* Combined keyboard and joystick input */

 const canWalk=!liftMoving&&!isDriving;

 const pcForward=
  (keys['KeyW']?1:0)-(keys['KeyS']?1:0);

 const pcStrafe=
  (keys['KeyD']?1:0)-(keys['KeyA']?1:0);

 const forwardInput=clamp(
  pcForward-moveY,-1,1
 );

 const strafeInput=clamp(
  pcStrafe+moveX,-1,1
 );

 const moving=canWalk&&(
  Math.abs(forwardInput)>.05||
  Math.abs(strafeInput)>.05
 );

 const running=
  keys['ShiftLeft']||keys['ShiftRight']||isRunning;

 const crouching=!isDriving&&(
  (!flyMode&&(keys['ControlLeft']||keys['ControlRight']))||isCrouching
 );
 crouchBlend+=(Number(crouching)-crouchBlend)*Math.min(1,dt*9);

 const speed=crouching?1.6:(running?9.2:3.25);

 /* Normalize diagonal movement */

 const inputLength=Math.hypot(forwardInput,strafeInput);

 const forward=inputLength>1
  ?forwardInput/inputLength:forwardInput;

 const strafe=inputLength>1
  ?strafeInput/inputLength:strafeInput;

 /* Camera-relative movement */

 if(moving){
   const desiredX=playerPosition.x+(
    Math.cos(yaw)*strafe-Math.sin(yaw)*forward
   )*speed*dt;

   const desiredZ=playerPosition.z+(
    -Math.sin(yaw)*strafe-Math.cos(yaw)*forward
   )*speed*dt;

   // Keep outdoor walking within the spaceport pad around the building.
   const nextX=clamp(desiredX,-48,48);
   const nextZ=clamp(desiredZ,-63,63);

   /* Collision */

   const blocked=(x,z)=>{

    const wallHit=solidWallsByLevel[floorLevel].some(w=>
     Math.abs(x-w.x)<w.w/2+.28&&
     Math.abs(z-w.z)<w.d/2+.28&&
     jumpHeight<w.y+w.h/2&&
     jumpHeight+playerHeight>w.y-w.h/2
    );

    const doorHit=(
     !liftMoving&&
     liftDoorProgress<.98&&
     Math.abs(z-(LIFT_Z-1.53))<.35&&
     liftDoorPanels.some(door=>
      Math.abs(x-(LIFT_X+door.group.position.x))<.69
     )
    );

    return wallHit||doorHit;
   };

   if(!blocked(nextX,playerPosition.z)){
    playerPosition.x=nextX;
   }

   if(!blocked(playerPosition.x,nextZ)){
    playerPosition.z=nextZ;
   }
 }

 /* Free camera moves independently while WASD still controls the character. */
 if(flyMode&&freeCamOffset){
  const cameraForward=(keys['ArrowUp']?1:0)-(keys['ArrowDown']?1:0);
  const cameraStrafe=(keys['ArrowRight']?1:0)-(keys['ArrowLeft']?1:0);
  const cameraVertical=(keys['Space']?1:0)-
   ((keys['ControlLeft']||keys['ControlRight'])?1:0);
  const cameraInputLength=Math.hypot(cameraForward,cameraStrafe);
  const cameraSpeed=running?9.2:5.5;
  const cameraScale=cameraInputLength>1?1/cameraInputLength:1;
  freeCamOffset.x+=(-Math.sin(yaw)*cameraForward+Math.cos(yaw)*cameraStrafe)*
   cameraSpeed*dt*cameraScale;
  freeCamOffset.z+=(-Math.cos(yaw)*cameraForward-Math.sin(yaw)*cameraStrafe)*
   cameraSpeed*dt*cameraScale;
  freeCamOffset.y+=cameraVertical*cameraSpeed*dt;
 }

 /* The accelerator follows the selected gear; S and the brake pedal slow the car. */
 if(isDriving){
  const throttle=clamp((keys['KeyW']?1:0)+touchGas,0,1);
  const braking=keys['KeyS']||touchBrake;
  // Positive steering turns left in the car's local coordinate system.
  const keyboardSteering=(keys['KeyA']?1:0)-(keys['KeyD']?1:0);
  const steering=clamp(carSteering+keyboardSteering,-1,1);

  if(braking|| (throttle>.05&&carSpeed*carGear<0)){
   carSpeed=Math.sign(carSpeed)*Math.max(0,Math.abs(carSpeed)-18*dt);
  }else if(throttle>.05){
   carSpeed+=carGear*throttle*8*dt;
  }else{
   carSpeed*=Math.max(0,1-dt*1.5);
  }
  carSpeed=clamp(carSpeed,-5,14);

  const steeringAngle=steering*.7;
  for(const pivot of frontWheelPivots){
   pivot.rotation.y+=(
    steeringAngle-pivot.rotation.y
   )*Math.min(1,dt*20);
  }

  if(Math.abs(carSpeed)>.08){
   const speedFactor=Math.min(1,Math.abs(carSpeed)/3);
   carGroup.rotation.y+=steering*speedFactor*dt*1.5*
    (carSpeed<0?-1:1);
  }

  const nextX=carGroup.position.x-Math.sin(carGroup.rotation.y)*carSpeed*dt;
  const nextZ=carGroup.position.z-Math.cos(carGroup.rotation.y)*carSpeed*dt;
  carGroup.position.x=clamp(nextX,-46,46);
  // Let the car travel around every side of the building, not just the approach road.
  carGroup.position.z=clamp(nextZ,-61,61);

  for(const wheel of carWheels){
   wheel.rotation.x-=carSpeed*dt/.4;
  }
 }

 /* Jump physics */

 const previousHeight=jumpHeight;

 if(!grounded){

  jumpVelocity-=24.5*dt;
  jumpHeight+=jumpVelocity*dt;

  if(jumpVelocity<=0&&jumpHeight<=0){
   jumpHeight=0;
   jumpVelocity=0;
   grounded=true;
  }
 }

 /* Camera movement animation */

 const targetBobPower=moving?(running?1:crouching?.3:.55):0;
 bobPower+=(targetBobPower-bobPower)*Math.min(1,dt*8);

 if(moving){
  walkPhase+=dt*(running?12:(crouching?6:8));
 } else {
  walkPhase=0;
 }

 const targetHeight=crouching?1.02:1.62;

 playerHeight+=(
  targetHeight-playerHeight
 )*Math.min(1,dt*10);

 const bobAmount=crouching?.018:(running?.075:.04);

    if(!isDriving){
  playerPosition.y=
   floorLevel*FLOOR_SPACING+
   liftOffset+
   playerHeight+
   jumpHeight;
 }

 const characterGroundY=
  floorLevel*FLOOR_SPACING+liftOffset+jumpHeight;
 character.position.set(
  playerPosition.x,
  characterGroundY+Math.sin(walkPhase*2)*.035*bobPower,
  playerPosition.z
 );
 character.rotation.y=yaw;
character.rotation.z+=(
  clamp(strafe,-1,1)*-.12-character.rotation.z
 )*Math.min(1,dt*10);
character.visible=!isDriving;
 character.scale.y=1-crouchBlend*.2;
 const gait=Math.sin(walkPhase);
 const gaitAmount=moving?(running?.72:(crouching?.2:.58)):0;
 const crouchPose=crouchBlend*.55;
 characterParts.leftArm.rotation.x=gait*gaitAmount+crouchPose;
 characterParts.rightArm.rotation.x=-gait*gaitAmount+crouchPose;
 characterParts.leftLeg.rotation.x=-gait*gaitAmount+crouchPose;
 characterParts.rightLeg.rotation.x=gait*gaitAmount+crouchPose;
 characterParts.leftArm.rotation.z=0;
 characterParts.rightArm.rotation.z=0;

 if(isDriving){
  // Keep the chase camera behind the car and aligned with its heading.
  yaw=carGroup.rotation.y;
  pitch=-.12;
  camera.position.set(
   carGroup.position.x+Math.sin(yaw)*6.2,
   carGroup.position.y+2.8,
   carGroup.position.z+Math.cos(yaw)*6.2
  );
 }else if(flyMode&&freeCamOffset){
  camera.position.copy(playerPosition).add(freeCamOffset);
 }else{
  const targetY=characterGroundY+1.0;
  const followDistance=4.8;
  camera.position.set(
   playerPosition.x+Math.sin(yaw)*Math.cos(pitch)*followDistance,
   targetY-Math.sin(pitch)*followDistance,
   playerPosition.z+Math.cos(yaw)*Math.cos(pitch)*followDistance
  );
  camera.lookAt(playerPosition.x,targetY,playerPosition.z);
 }

 /* HUD */

 tag.textContent=floorLevel===0?'RECEPTION':'DECK '+floorLevel;

 /* Camera */

 camera.rotation.order='YXZ';
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
 camera.rotation.z=moving
  ?Math.sin(walkPhase)*(running?.018:.009)*bobPower
  :camera.rotation.z*Math.max(0,1-dt*8);

 updateLiftAim(insideLift);

 const carDistance=Math.hypot(
  playerPosition.x-carGroup.position.x,
  playerPosition.z-carGroup.position.z
 );
 carBtn.hidden=!(isDriving||(!liftMoving&&carDistance<3.4));
 carBtn.textContent=isDriving?'EXIT':'DRIVE';
 base.hidden=isDriving;
 steeringWheel.hidden=!isDriving;
 gasBtn.hidden=!isDriving;
 brakeBtn.hidden=!isDriving;
 gearControls.hidden=!isDriving;
 runBtn.hidden=isDriving;
 crouchBtn.hidden=isDriving;
 jumpBtn.hidden=isDriving;
 interactBtn.hidden=interactBtn.hidden||isDriving;
 steerLabel.textContent=isDriving?'STEER':'MOVE';
 hint.style.display=isDriving?'none':'';

 const outsideBuilding=
  Math.abs(playerPosition.x)>AREA_WIDTH/2||
  Math.abs(playerPosition.z)>AREA_LENGTH/2;
 const activeDeck=liftMoving?-1:floorLevel;
 if(activeDeck!==visibleDeck||flyMode!==visibleFlyMode){
  visibleDeck=activeDeck;
  visibleFlyMode=flyMode;
  for(let level=0;level<FLOOR_COUNT;level++){
   const deckVisible=flyMode||outsideBuilding||level===activeDeck;
   for(const mesh of deckRenderableMeshes[level]){
    mesh.visible=deckVisible;
   }
   if(floorSlabMeshes[level]){
    floorSlabMeshes[level].visible=deckVisible||(
     !flyMode&&!outsideBuilding&&level===activeDeck+1
    );
   }
  }
 }

 renderer.render(scene,camera);
}

/* ---------------- 3D CABIN MODEL ---------------- */

const gltfLoader = new GLTFLoader();

// Extra light inside the first left-side cabin room on deck 1.
const cabinRoomLight = new THREE.PointLight(0xa8d9ff, 42, 13, 1.5);
cabinRoomLight.position.set(-8, FLOOR_SPACING+2.8, -16.8);
scene.add(cabinRoomLight);

gltfLoader.load(
  './slupspace_cabin.glb',

  function(gltf) {
    const cabin = gltf.scene;

    // Keep the cabin inside the first room above reception.
    cabin.position.set(-8, FLOOR_SPACING, -16.8);
    cabin.scale.set(2, 2, 2);

    cabin.traverse(function(obj) {
      if (obj.isMesh) {
        obj.castShadow = false;
        obj.receiveShadow = false;
        if (obj.material) {
          obj.material.side = THREE.DoubleSide;
        }
      }
    });

    scene.add(cabin);
    console.log('SPACESHIP CABIN LOADED');
  },

  undefined,
  function(error) {
    document.getElementById('tag').innerText = "ERROR: " + error.message;
    console.error('CABIN GLB FAILED TO LOAD:', error);
  }
);

/* ---------------- SPACE EXTERIOR ---------------- */

function buildSpaceExterior(){
 // Soft atmospheric glow around a small, warm daytime sun.
 const sunPosition=new THREE.Vector3(-65,110,-140);
 const sun=new THREE.Mesh(
  new THREE.SphereGeometry(3.2,32,24),
  new THREE.MeshBasicMaterial({color:0xfff1c2,fog:false})
 );
 sun.position.copy(sunPosition);
 scene.add(sun);

 const glowCanvas=document.createElement('canvas');
 glowCanvas.width=glowCanvas.height=128;
 const glowContext=glowCanvas.getContext('2d');
 const glowGradient=glowContext.createRadialGradient(64,64,2,64,64,64);
 glowGradient.addColorStop(0,'rgba(255,245,210,.38)');
 glowGradient.addColorStop(.25,'rgba(255,232,180,.16)');
 glowGradient.addColorStop(1,'rgba(255,220,160,0)');
 glowContext.fillStyle=glowGradient;
 glowContext.fillRect(0,0,128,128);
 const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({
  map:new THREE.CanvasTexture(glowCanvas),
  color:0xffe6b0,transparent:true,depthWrite:false,fog:false,
  blending:THREE.AdditiveBlending
 }));
 sunGlow.position.copy(sunPosition);
 sunGlow.scale.set(34,34,1);
 scene.add(sunGlow);

 // The faint daytime moon has subtle mottling and crater marks.
 const moonCanvas=document.createElement('canvas');
 moonCanvas.width=512;
 moonCanvas.height=256;
 const moonContext=moonCanvas.getContext('2d');
 moonContext.fillStyle='#c5c6c2';
 moonContext.fillRect(0,0,moonCanvas.width,moonCanvas.height);
 for(let i=0;i<1800;i++){
  const shade=Math.random()>.5?'#e0dfd8':'#969994';
  moonContext.globalAlpha=.025+Math.random()*.09;
  moonContext.fillStyle=shade;
  moonContext.beginPath();
  moonContext.arc(
   Math.random()*moonCanvas.width,
   Math.random()*moonCanvas.height,
   1+Math.random()*7,0,Math.PI*2
  );
  moonContext.fill();
 }
 moonContext.globalAlpha=.12;
 for(const [x,y,r] of [[105,92,25],[258,145,34],[390,78,21],[455,180,27]]){
  moonContext.fillStyle='#737874';
  moonContext.beginPath();
  moonContext.ellipse(x,y,r,r*.62,.2,0,Math.PI*2);
  moonContext.fill();
  moonContext.strokeStyle='#ecebe4';
  moonContext.lineWidth=4;
  moonContext.stroke();
 }
 moonContext.globalAlpha=1;
 const moonTexture=new THREE.CanvasTexture(moonCanvas);
 moonTexture.colorSpace=THREE.SRGBColorSpace;
 const moon=new THREE.Mesh(
  new THREE.SphereGeometry(3.1,40,32),
  new THREE.MeshStandardMaterial({
   map:moonTexture,color:0xe0e0dc,roughness:1,metalness:0,fog:false
  })
 );
 moon.position.set(60,82,-170);
 scene.add(moon);

 // A broad, softly mottled terrain surface makes the area outside feel natural.
 const groundCanvas=document.createElement('canvas');
 groundCanvas.width=groundCanvas.height=256;
 const groundContext=groundCanvas.getContext('2d');
 const groundPixels=groundContext.createImageData(256,256);
 for(let i=0;i<groundPixels.data.length;i+=4){
  const variation=(Math.random()-.5)*30;
  groundPixels.data[i]=Math.max(0,103+variation);
  groundPixels.data[i+1]=Math.max(0,112+variation);
  groundPixels.data[i+2]=Math.max(0,77+variation*.7);
  groundPixels.data[i+3]=255;
 }
 groundContext.putImageData(groundPixels,0,0);
 for(let i=0;i<1800;i++){
  const shade=Math.random()>.5?'#9a916c':'#586b4d';
  groundContext.fillStyle=shade;
  groundContext.globalAlpha=.08+Math.random()*.15;
  groundContext.beginPath();
  groundContext.ellipse(
   Math.random()*256,Math.random()*256,
   1+Math.random()*5,1+Math.random()*3,
   Math.random()*Math.PI,0,Math.PI*2
  );
  groundContext.fill();
 }
 groundContext.globalAlpha=1;
 const groundTexture=new THREE.CanvasTexture(groundCanvas);
 groundTexture.wrapS=groundTexture.wrapT=THREE.RepeatWrapping;
 groundTexture.repeat.set(6,8);
 groundTexture.colorSpace=THREE.SRGBColorSpace;
 const landingPad=new THREE.Mesh(
  new THREE.BoxGeometry(100,.35,130),
  new THREE.MeshStandardMaterial({
   map:groundTexture,color:0xc4c4a1,roughness:1
  })
 );
 // Keep the ground below reception's floor to avoid coplanar flicker.
 landingPad.position.set(0,-.31,0);
 scene.add(landingPad);

 // Dark asphalt road leading from the reception entrance.
 const roadMat=new THREE.MeshStandardMaterial({
  color:0x292b2d,roughness:.96,metalness:0
 });
 const road=new THREE.Mesh(
  new THREE.BoxGeometry(7,.12,27),roadMat
 );
 road.position.set(0,-.075,-34.5);
 scene.add(road);

 // A single instanced batch keeps the road markings cheap to render.
 const roadMarkingMat=new THREE.MeshStandardMaterial({
  color:0xb6b29f,roughness:1,metalness:0
 });
 const roadDashes=new THREE.InstancedMesh(
  new THREE.BoxGeometry(.12,.012,1),roadMarkingMat,54
 );
 const dashTransform=new THREE.Object3D();
 let dashIndex=0;
 for(let z=-46;z<=-23;z+=4){
  dashTransform.position.set(0,-.006,z);
  dashTransform.rotation.set(0,0,0);
  dashTransform.scale.set(1,1,1.6);
  dashTransform.updateMatrix();
  roadDashes.setMatrixAt(dashIndex++,dashTransform.matrix);
 }

 // A circular loop clears the building's corners and joins the approach road.
 const roadRadius=30;
 const roadHalfWidth=3.5;
 const roadSegments=128;
 const ringVertices=[];
 const ringIndices=[];
 for(let i=0;i<=roadSegments;i++){
  const angle=i/roadSegments*Math.PI*2;
  const x=Math.cos(angle);
  const z=Math.sin(angle);
  ringVertices.push(
   x*(roadRadius-roadHalfWidth),-.014,z*(roadRadius-roadHalfWidth),
   x*(roadRadius+roadHalfWidth),-.014,z*(roadRadius+roadHalfWidth)
  );
  if(i<roadSegments){
   const inner=i*2;
   const outer=inner+1;
   ringIndices.push(inner,outer,inner+2,outer,outer+2,inner+2);
  }
 }
 const ringGeometry=new THREE.BufferGeometry();
 ringGeometry.setAttribute(
  'position',new THREE.Float32BufferAttribute(ringVertices,3)
 );
 ringGeometry.setIndex(ringIndices);
 ringGeometry.computeVertexNormals();
 const circularRoad=new THREE.Mesh(
  ringGeometry,new THREE.MeshStandardMaterial({
   color:0x292b2d,roughness:.96,metalness:0,side:THREE.DoubleSide
  })
 );
 scene.add(circularRoad);

 // Broken centerline dashes follow the loop's tangent; leave a gap at the road junction.
 for(let i=0;i<48;i++){
  if(i>=35&&i<=37)continue;
  const angle=i/48*Math.PI*2;
  dashTransform.position.set(
   Math.cos(angle)*roadRadius,-.006,Math.sin(angle)*roadRadius
  );
  dashTransform.rotation.set(0,-angle,0);
  dashTransform.scale.set(1,1,1.45);
  dashTransform.updateMatrix();
  roadDashes.setMatrixAt(dashIndex++,dashTransform.matrix);
 }
 roadDashes.count=dashIndex;
 roadDashes.instanceMatrix.needsUpdate=true;
 scene.add(roadDashes);

  }

/* ---------------- START GAME ---------------- */

buildBuilding();
buildWallChunks();
buildLift();
buildSpaceExterior();

requestAnimationFrame(animate);

/* ---------------- RESIZE ---------------- */

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1));
 renderer.setSize(innerWidth,innerHeight);
});

</script>
