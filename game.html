}

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c0f);
scene.fog=new THREE.Fog(0x090c0f,8,30);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.08,180);
const torch=new THREE.SpotLight(0xffdfb0,180,30,Math.PI/6,.55,1.6);
const torchTarget=new THREE.Object3D();
torch.position.set(.08,-.06,0);torchTarget.position.set(0,0,-1);

const renderer=new THREE.WebGLRenderer({antialias:true});

// The torch is the room's only broad source of illumination.

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-27,0)});

const surfaceTextures={};

 ctx.putImageData(image,0,0);
 if(kind==='wall'||kind==='floor'){
  ctx.strokeStyle='#20242624';ctx.lineWidth=2;
  for(let y=0;y<256;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();}

 }
 for(let i=0;i<90;i++){const x=(i*73+seed*11)%256,y=(i*137+seed*7)%256,r=1+(i%3);ctx.fillStyle=i%2?'#10171918':'#ffffff20';ctx.fillRect(x,y,r,r);}
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(4,4);texture.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());

}
function roomBox(name,x,y,z,sx,sy,sz,color,collide=true){
 const kind=name==='Stepping platform'?'stone':name==='Floor'?'floor':name.includes('platform')?'stone':name==='Ceiling'?'ceiling':'wall';
 const texture=makeSurfaceTexture(kind);
 const material=new THREE.MeshStandardMaterial({color,map:texture,bumpMap:texture,bumpScale:.025,roughness:.95,metalness:0});
 const mesh=new THREE.Mesh(boxGeo,material);mesh.name=name;mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);mesh.receiveShadow=true;scene.add(mesh);
 if(collide){const body=new CANNON.Body({mass:0,material:matGround,shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2)),position:new CANNON.Vec3(x,y,z)});world.addBody(body);}

}

// A long, uncluttered room: 90 metres wide, 150 metres long, and 14 metres high.
roomBox('Floor',0,-.35,0,90,.7,150,0x282e31);
const waterGeo=new THREE.PlaneGeometry(89.6,149.6,64,108);
waterGeo.rotateX(-Math.PI/2);
const waterPositions=waterGeo.attributes.position;
const waterBase=Float32Array.from(waterPositions.array);
const water=new THREE.Mesh(waterGeo,new THREE.MeshStandardMaterial({color:0x31515a,roughness:.2,metalness:.35,transparent:true,opacity:.62,side:THREE.DoubleSide,depthWrite:false}));
water.position.y=.025;water.receiveShadow=true;scene.add(water);
roomBox('Back wall',0,7,-75,90,14,.6,0x1d2428);
roomBox('Front wall',0,7,75,90,14,.6,0x20272b);
roomBox('Left wall',-45,7,0,.6,14,150,0x20272b);
roomBox('Right wall',45,7,0,.6,14,150,0x1b2226);
roomBox('Ceiling',0,14.3,0,90,.6,150,0x14191c,false);

// Raised platforms at the two ends of the room.
roomBox('End platform',0,.4,-71.2,89.4,.8,7,0x687276);
roomBox('End platform',0,.4,71.2,89.4,.8,7,0x687276);

// A framed exit stands on the far platform, facing into the room.
const doorFrameMat=new THREE.MeshStandardMaterial({color:0x292426,roughness:.72,metalness:.35});
const doorTextureCanvas=document.createElement('canvas');doorTextureCanvas.width=512;doorTextureCanvas.height=1024;
const doorCtx=doorTextureCanvas.getContext('2d');
const woodBase=doorCtx.createLinearGradient(0,0,512,0);woodBase.addColorStop(0,'#24140f');woodBase.addColorStop(.18,'#53301e');woodBase.addColorStop(.5,'#75452b');woodBase.addColorStop(.82,'#492719');woodBase.addColorStop(1,'#21120e');
doorCtx.fillStyle=woodBase;doorCtx.fillRect(0,0,512,1024);
for(let i=0;i<90;i++){const x=(i*73)%512;doorCtx.beginPath();doorCtx.moveTo(x,0);doorCtx.bezierCurveTo(x+((i%5)-2)*9,330,x+((i%7)-3)*7,680,x+((i%4)-2)*8,1024);doorCtx.strokeStyle=i%3===0?'#160d0a55':'#d18a4a22';doorCtx.lineWidth=i%6===0?3:1;doorCtx.stroke();}
function doorPanel(x,y,w,h){const g=doorCtx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#9a6340');g.addColorStop(.18,'#57321f');g.addColorStop(.55,'#75472d');g.addColorStop(1,'#321b13');doorCtx.fillStyle='#1a100d';doorCtx.fillRect(x-9,y-9,w+18,h+18);doorCtx.fillStyle=g;doorCtx.fillRect(x,y,w,h);doorCtx.strokeStyle='#bb8150';doorCtx.lineWidth=5;doorCtx.strokeRect(x+5,y+5,w-10,h-10);doorCtx.strokeStyle='#21130d';doorCtx.lineWidth=3;doorCtx.strokeRect(x+12,y+12,w-24,h-24);}
doorPanel(74,72,364,245);doorPanel(74,389,364,245);doorPanel(74,706,364,245);
const doorTexture=new THREE.CanvasTexture(doorTextureCanvas);doorTexture.colorSpace=THREE.SRGBColorSpace;
const doorPanelMat=new THREE.MeshStandardMaterial({map:doorTexture,color:0xffffff,roughness:.82,metalness:.04});
function doorPart(x,y,z,sx,sy,sz,material){const mesh=new THREE.Mesh(boxGeo,material);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);}
const doorZ=-74.42;
doorPart(-2.55,5.2,doorZ,.34,8.8,.38,doorFrameMat);
doorPart(2.55,5.2,doorZ,.34,8.8,.38,doorFrameMat);
doorPart(0,9.43,doorZ,5.45,.34,.38,doorFrameMat);
doorPart(0,4.85,doorZ+.08,4.72,8.1,.18,doorPanelMat);
const signCanvas=document.createElement('canvas');signCanvas.width=512;signCanvas.height=128;
const signCtx=signCanvas.getContext('2d');signCtx.font='900 88px system-ui,sans-serif';signCtx.textAlign='center';signCtx.textBaseline='middle';
signCtx.shadowColor='#ff1010';signCtx.shadowBlur=28;signCtx.fillStyle='#ff3434';signCtx.fillText('EXIT',256,66);
const signTexture=new THREE.CanvasTexture(signCanvas);signTexture.colorSpace=THREE.SRGBColorSpace;
const exitSign=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.1),new THREE.MeshStandardMaterial({map:signTexture,transparent:true,depthWrite:false,roughness:.8}));
exitSign.position.set(0,10.25,-74.12);scene.add(exitSign);

// Narrower stepping stones and longer gaps make the crossing a tougher jumping route.
const steppingStones=[];
function addSteppingStone(x,z){
 roomBox('Stepping platform',x,.4,z,3.5,.8,3.5,Math.random()<.5?0x687276:0x59666a);
 steppingStones.push({x,z});
}
let pathX=0,pathZ=62.5;
while(pathZ>-62.5){
 const nextZ=Math.max(-62.5,pathZ-(5.5+Math.random()*1.1));
 const dz=pathZ-nextZ;
 const maxShift=Math.sqrt(Math.max(0,9.4*9.4-dz*dz));
 pathX=THREE.MathUtils.clamp(pathX+(Math.random()*2-1)*maxShift,-41,41);
 pathZ=nextZ;
 addSteppingStone(pathX,pathZ);
}
let extraStones=0,attempts=0;
while(extraStones<10&&attempts<1200){
 attempts++;
 const x=-42+Math.random()*84,z=-65+Math.random()*130;
 if(steppingStones.some(s=>Math.hypot(s.x-x,s.z-z)<7))continue;
 addSteppingStone(x,z);extraStones++;
}

// Subtle recessed-looking light panels on the ceiling.
const panelGeo=new THREE.BoxGeometry(3.2,.08,1.1);
for(const [x,z] of [[0,0],[-17,-12],[17,13]]){
 const panel=new THREE.Mesh(panelGeo,new THREE.MeshStandardMaterial({color:0x6c716b,roughness:.9}));panel.position.set(x,13.96,z);scene.add(panel);
}

const player=new CANNON.Body({mass:72,material:matPlayer,position:new CANNON.Vec3(0,1.61,70.2),linearDamping:.02,angularDamping:1,fixedRotation:true});
player.addShape(new CANNON.Cylinder(.36,.36,.9,12));
player.addShape(new CANNON.Sphere(.36),new CANNON.Vec3(0,.45,0));
player.addShape(new CANNON.Sphere(.36),new CANNON.Vec3(0,-.45,0));
player.updateMassProperties();player.allowSleep=false;world.addBody(player);

// The Hollow waits beneath the surface until the player falls into the water.
const monsterRoot=new THREE.Group();scene.add(monsterRoot);monsterRoot.position.set(-27,.04,-38);monsterRoot.visible=true;
const monsterSkin=new THREE.MeshStandardMaterial({color:0x26322e,roughness:.92});
const monsterShadow=new THREE.MeshStandardMaterial({color:0x111816,roughness:.96});
const monsterRidge=new THREE.MeshStandardMaterial({color:0x56615a,roughness:.84});
const monsterBone=new THREE.MeshStandardMaterial({color:0xaaa48e,roughness:.58});
const monsterEye=new THREE.MeshStandardMaterial({color:0xff2938,emissive:0xb50018,emissiveIntensity:3.2,roughness:.2});
const monsterMouth=new THREE.MeshStandardMaterial({color:0x17080b,roughness:.3});
function monsterBall(parent,material,position,scale){const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),material);m.position.set(...position);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function monsterRod(parent,material,a,b,r1,r2){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),8),material);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;parent.add(m);return m;}
const monsterBody=new THREE.Group();monsterBody.position.y=2.15;monsterRoot.add(monsterBody);
monsterBall(monsterBody,monsterSkin,[0,0,0],[.82,.9,.68]);
monsterBall(monsterBody,monsterShadow,[0,-.58,-.42],[.62,.55,.88]);
monsterBall(monsterBody,monsterRidge,[-.12,.55,-.08],[.72,.38,.54]);
const monsterFace=new THREE.Group();monsterFace.position.set(0,.72,.48);monsterBody.add(monsterFace);
monsterBall(monsterFace,monsterShadow,[0,0,0],[.54,.67,.25]);
monsterBall(monsterFace,monsterMouth,[0,-.23,.22],[.34,.34,.08]);
for(let row=0;row<3;row++)for(const side of [-1,1]){
 const x=side*(.18+row*.035),y=.35-row*.25;
 monsterBall(monsterFace,monsterRidge,[x,y,.2],[.13,.12,.07]);
 monsterBall(monsterFace,monsterEye,[x,y,.26],[.065,.075,.045]);
}
for(let i=0;i<12;i++){
 const a=i*Math.PI*2/12,x=Math.cos(a)*.31,y=-.23+Math.sin(a)*.27;
 const tooth=new THREE.Mesh(new THREE.ConeGeometry(.035,.16,5),monsterBone);tooth.position.set(x,y,.29);tooth.rotation.z=-a+Math.PI/2;monsterFace.add(tooth);
}
for(const side of [-1,1]){
 const horn=new THREE.Mesh(new THREE.ConeGeometry(.11,.62,7),monsterShadow);horn.position.set(side*.3,.63,-.05);horn.rotation.z=-side*.38;monsterFace.add(horn);
}
const monsterLimbs=[];
for(let i=0;i<6;i++){
 const a=i*Math.PI/3,spread=Math.cos(a),depth=Math.sin(a),pivot=new THREE.Group();
 pivot.position.set(spread*.48,-.18,depth*.42);monsterBody.add(pivot);
 const bend=[spread*.53,-1.08,depth*.52],end=[spread*.25,-.92,depth*.32];
 monsterRod(pivot,monsterSkin,[0,0,0],bend,.18,.12);
 const joint=new THREE.Group();joint.position.set(...bend);pivot.add(joint);monsterBall(joint,monsterRidge,[0,0,0],[.17,.16,.17]);
 monsterRod(joint,monsterShadow,[0,0,0],end,.12,.065);
 for(let f=0;f<3;f++){const tip=[end[0]+spread*.2+(f-1)*.13,end[1]-.32,end[2]+depth*.12];monsterRod(joint,monsterBone,end,tip,.045,.012);}
 monsterLimbs.push({pivot,joint,phase:i*Math.PI/3});
}
let monsterMode='roam',monsterCaught=false,levelCompleted=false,wasOnRaisedBlock=false,retreatTimer=0;
const monsterTarget=new THREE.Vector3(25,.04,35);
const retreatTarget=new THREE.Vector3(-41,.04,-66.4);

// Keep the monster's footprint outside raised geometry; axis-separated checks let it slide along edges.
function monsterBlocked(x,z){
 const radius=.9;
 for(const stone of steppingStones){
  const nearestX=THREE.MathUtils.clamp(x,stone.x-1.75,stone.x+1.75);
  const nearestZ=THREE.MathUtils.clamp(z,stone.z-1.75,stone.z+1.75);
  if((x-nearestX)**2+(z-nearestZ)**2<radius*radius)return true;
 }
 for(const centerZ of [-71.2,71.2]){
  const nearestX=THREE.MathUtils.clamp(x,-44.7,44.7);
  const nearestZ=THREE.MathUtils.clamp(z,centerZ-3.5,centerZ+3.5);
  if((x-nearestX)**2+(z-nearestZ)**2<radius*radius)return true;
 }
 return false;
}

// Random stones can land on the monster's initial position; move it to the nearest clear spot.
if(monsterBlocked(monsterRoot.position.x,monsterRoot.position.z)){
 let best=null,bestDistance=Infinity;
 for(let x=-42;x<=42;x+=1)for(let z=-70;z<=70;z+=1){
  if(monsterBlocked(x,z))continue;
  const distance=Math.hypot(x-monsterRoot.position.x,z-monsterRoot.position.z);
  if(distance<bestDistance){best={x,z};bestDistance=distance;}
 }
 if(best)monsterRoot.position.set(best.x,.04,best.z);
}

// Plan routes on a fine grid so the monster can navigate around stone corners.
const navStep=.5,navMinX=-42,navMinZ=-70,navCols=169,navRows=281;
const navBlocked=new Uint8Array(navCols*navRows);
const navIndex=(ix,iz)=>iz*navCols+ix;
const navPosition=(ix,iz)=>({x:navMinX+ix*navStep,z:navMinZ+iz*navStep});
for(let iz=0;iz<navRows;iz++)for(let ix=0;ix<navCols;ix++){
 const p=navPosition(ix,iz);navBlocked[navIndex(ix,iz)]=monsterBlocked(p.x,p.z)?1:0;
}
function nearestNavIndex(x,z){
 const cx=THREE.MathUtils.clamp(Math.round((x-navMinX)/navStep),0,navCols-1);
 const cz=THREE.MathUtils.clamp(Math.round((z-navMinZ)/navStep),0,navRows-1);
 let best=-1,bestDist=Infinity;
 for(let radius=0;radius<14&&best<0;radius++){
  for(let iz=Math.max(0,cz-radius);iz<=Math.min(navRows-1,cz+radius);iz++)for(let ix=Math.max(0,cx-radius);ix<=Math.min(navCols-1,cx+radius);ix++){
   if(Math.max(Math.abs(ix-cx),Math.abs(iz-cz))!==radius)continue;
   const index=navIndex(ix,iz);if(navBlocked[index])continue;
   const p=navPosition(ix,iz),dist=(p.x-x)**2+(p.z-z)**2;
   if(dist<bestDist){best=index;bestDist=dist;}
  }
 }
 return best;
}
function findMonsterPath(startX,startZ,targetX,targetZ){
 const start=nearestNavIndex(startX,startZ),goal=nearestNavIndex(targetX,targetZ);
 if(start<0||goal<0)return [];
 if(start===goal)return [start];
 const count=navCols*navRows,gScore=new Float32Array(count),cameFrom=new Int32Array(count),closed=new Uint8Array(count);
 gScore.fill(Infinity);cameFrom.fill(-1);gScore[start]=0;
 const heapNodes=[],heapScores=[];
 function push(node,score){
  let i=heapNodes.length;heapNodes.push(node);heapScores.push(score);
  while(i>0){const parent=(i-1)>>1;if(heapScores[parent]<=score)break;heapNodes[i]=heapNodes[parent];heapScores[i]=heapScores[parent];i=parent;}
  heapNodes[i]=node;heapScores[i]=score;
 }
 function pop(){
  const node=heapNodes[0],lastNode=heapNodes.pop(),lastScore=heapScores.pop();
  if(heapNodes.length){let i=0;while(true){let child=i*2+1;if(child>=heapNodes.length)break;if(child+1<heapNodes.length&&heapScores[child+1]<heapScores[child])child++;if(heapScores[child]>=lastScore)break;heapNodes[i]=heapNodes[child];heapScores[i]=heapScores[child];i=child;}heapNodes[i]=lastNode;heapScores[i]=lastScore;}
  return node;
 }
 function heuristic(index){const x=index%navCols,z=Math.floor(index/navCols),gx=goal%navCols,gz=Math.floor(goal/navCols),dx=Math.abs(x-gx),dz=Math.abs(z-gz);return Math.max(dx,dz)+(Math.SQRT2-1)*Math.min(dx,dz);}
 push(start,heuristic(start));
 while(heapNodes.length){
  const current=pop();if(closed[current])continue;if(current===goal)break;closed[current]=1;
  const ix=current%navCols,iz=Math.floor(current/navCols);
  for(let oz=-1;oz<=1;oz++)for(let ox=-1;ox<=1;ox++){
   if(!ox&&!oz)continue;const nx=ix+ox,nz=iz+oz;
   if(nx<0||nx>=navCols||nz<0||nz>=navRows)continue;
   const next=navIndex(nx,nz);if(navBlocked[next]||closed[next])continue;
   if(ox&&oz&&(navBlocked[navIndex(ix+ox,iz)]||navBlocked[navIndex(ix,iz+oz)]))continue;
   const score=gScore[current]+(ox&&oz?Math.SQRT2:1);
   if(score<gScore[next]){gScore[next]=score;cameFrom[next]=current;push(next,score+heuristic(next));}
  }
 }
 if(cameFrom[goal]<0)return [];
 const path=[goal];for(let node=goal;node!==start;){node=cameFrom[node];if(node<0)return [];path.push(node);}
 path.reverse();return path;
}
let monsterPath=[],monsterPathIndex=0,pathRefresh=0;
let monsterWalkPhase=0,monsterLimbActivity=0;

let yaw=0,pitch=0,keys={},mobileMove={x:0,y:0},grounded=false,jumpBuffer=0,coyoteTime=0,locked=false,crouched=false;
const eyeHeight=.48,clock=new THREE.Clock(),forward=new THREE.Vector3(),right=new THREE.Vector3(),wish=new THREE.Vector3();
function queueJump(){jumpBuffer=.18;}
function setCrouched(value){crouched=value;const button=document.querySelector('#crouch');button.classList.toggle('active',crouched);button.setAttribute('aria-pressed',String(crouched));}
function isGrounded(){
 // Start just below the player's feet so the ray does not hit the player collider.
 const from=new CANNON.Vec3(player.position.x,player.position.y-.805,player.position.z);
 const to=new CANNON.Vec3(player.position.x,player.position.y-1.12,player.position.z);
 const result=new CANNON.RaycastResult();world.raycastClosest(from,to,{skipBackfaces:true},result);return result.hasHit&&result.body!==player;
}
let lookSensitivity=8.0;
function setLook(dx,dy,sensitivity=lookSensitivity){yaw-=dx*sensitivity*.001;pitch-=dy*sensitivity*.001;pitch=Math.max(-1.25,Math.min(1.25,pitch));}
const settingsToggle=document.querySelector('#settingsToggle'),settingsPanel=document.querySelector('#settingsPanel'),sensitivityInput=document.querySelector('#sensitivity'),sensitivityValue=document.querySelector('#sensitivityValue');
sensitivityInput.addEventListener('input',()=>{lookSensitivity=Number(sensitivityInput.value);sensitivityValue.textContent=lookSensitivity.toFixed(1);});
settingsToggle.addEventListener('click',()=>{const open=settingsPanel.classList.toggle('open');settingsToggle.setAttribute('aria-expanded',String(open));});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;});
document.addEventListener('mousemove',e=>{if(locked)setLook(e.movementX,e.movementY);});
renderer.domElement.addEventListener('click',()=>{if(!matchMedia('(pointer:coarse)').matches&&!locked)renderer.domElement.requestPointerLock?.();});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&!e.repeat)queueJump();if(e.code==='KeyC'&&!e.repeat)setCrouched(!crouched);});
document.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null;
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/48,y=(e.clientY-cy)/48;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}mobileMove={x,y};nub.style.left=`${50+x*34}%`;nub.style.top=`${50+y*34}%`;}
function releaseStick(e){if(e.pointerId===stickId){stickId=null;mobileMove={x:0,y:0};nub.style.left='50%';nub.style.top='50%';}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);stick.addEventListener('lostpointercapture',releaseStick);
let lookId=null,lastX=0,lastY=0;const lookzone=document.querySelector('#lookzone');
lookzone.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;lookzone.setPointerCapture(lookId);});
lookzone.addEventListener('pointermove',e=>{if(e.pointerId===lookId){setLook(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY;}});
function releaseLook(e){if(!e||e.pointerId===lookId)lookId=null;}
lookzone.addEventListener('pointerup',releaseLook);lookzone.addEventListener('pointercancel',releaseLook);lookzone.addEventListener('lostpointercapture',releaseLook);
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();queueJump();});
document.querySelector('#nextLevel').addEventListener('click',()=>location.reload());
document.querySelector('#crouch').addEventListener('pointerdown',e=>{e.preventDefault();setCrouched(!crouched);});
addEventListener('blur',()=>{keys={};stickId=null;mobileMove={x:0,y:0};nub.style.left='50%';nub.style.top='50%';lookId=null;});

function update(dt){
 const kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+mobileMove.x;
 const kz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-mobileMove.y;
 const sprint=!crouched&&(keys.ShiftLeft||keys.ShiftRight),maxSpeed=crouched?3.5:(sprint?12.5:8);
 forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));
 wish.set(0,0,0).addScaledVector(right,kx).addScaledVector(forward,kz);if(wish.lengthSq()>1)wish.normalize();
 const accel=grounded?34:13;
 player.velocity.x+=(wish.x*maxSpeed-player.velocity.x)*Math.min(1,accel*dt);
 player.velocity.z+=(wish.z*maxSpeed-player.velocity.z)*Math.min(1,accel*dt);
 if(wish.lengthSq()<.001&&grounded){player.velocity.x*=Math.pow(.0008,dt);player.velocity.z*=Math.pow(.0008,dt);}
 jumpBuffer=Math.max(0,jumpBuffer-dt);
 coyoteTime=grounded?.14:Math.max(0,coyoteTime-dt);
 if(jumpBuffer>0&&coyoteTime>0){player.velocity.y=10.5;jumpBuffer=0;coyoteTime=0;grounded=false;}
}
function keepCrouchedOnPlatform(){
 if(!crouched||player.position.y<1.2)return;
 let bounds=null;
 for(const stone of steppingStones){
  if(Math.abs(player.position.x-stone.x)<=2.25&&Math.abs(player.position.z-stone.z)<=2.25){bounds={minX:stone.x-1.25,maxX:stone.x+1.25,minZ:stone.z-1.25,maxZ:stone.z+1.25};break;}
 }
 if(!bounds){
  for(const centerZ of [-71.2,71.2]){
   if(Math.abs(player.position.z-centerZ)<=3.95&&Math.abs(player.position.x)<=45.15){bounds={minX:-44.2,maxX:44.2,minZ:centerZ-3,maxZ:centerZ+3};break;}
  }
 }
 if(!bounds)return;
 const x=THREE.MathUtils.clamp(player.position.x,bounds.minX,bounds.maxX),z=THREE.MathUtils.clamp(player.position.z,bounds.minZ,bounds.maxZ);
 if(x!==player.position.x)player.velocity.x=0;
 if(z!==player.position.z)player.velocity.z=0;
 player.position.x=x;player.position.z=z;
}
function updateMonster(dt,time){
 const startX=monsterRoot.position.x,startZ=monsterRoot.position.z;
 const onRaisedBlock=grounded&&player.position.y>1.25;
 if(onRaisedBlock&&!wasOnRaisedBlock){retreatTimer=4;monsterMode='stare';}
 wasOnRaisedBlock=onRaisedBlock;
 retreatTimer=Math.max(0,retreatTimer-dt);
 const touchingWater=!onRaisedBlock&&player.position.y<=.86;
 if(touchingWater){
  retreatTimer=0;
  monsterMode='hunt';
 }else if(retreatTimer===0&&monsterMode==='stare'){
  retreatTimer=3.5;
  monsterMode='retreat';
 }else if(retreatTimer===0&&monsterMode==='retreat'){
  monsterMode='roam';
 }
 if(monsterMode==='roam'&&Math.hypot(monsterRoot.position.x-monsterTarget.x,monsterRoot.position.z-monsterTarget.z)<1.4){
  monsterTarget.set(-42+Math.random()*84,.04,-68+Math.random()*136);
 }
 let target,speed;
 if(monsterMode==='hunt'){
  target=player.position;speed=90;
 }else if(monsterMode==='stare'){
  target=player.position;speed=0;
 }else if(monsterMode==='retreat'){
  target=retreatTarget;speed=18;
 }else{
  target=monsterTarget;speed=4.8;
 }
 const dx=target.x-monsterRoot.position.x,dz=target.z-monsterRoot.position.z,distance=Math.hypot(dx,dz);
 if(monsterMode!=='stare'){
  pathRefresh-=dt;
  if(pathRefresh<=0||monsterPathIndex>=monsterPath.length){
   monsterPath=findMonsterPath(monsterRoot.position.x,monsterRoot.position.z,target.x,target.z);
   monsterPathIndex=Math.min(1,Math.max(0,monsterPath.length-1));pathRefresh=.55;
  }
  let remaining=speed*dt,guard=0;
  while(remaining>0&&monsterPathIndex<monsterPath.length&&guard++<400){
   const point=navPosition(monsterPath[monsterPathIndex]%navCols,Math.floor(monsterPath[monsterPathIndex]/navCols));
   const wx=point.x-monsterRoot.position.x,wz=point.z-monsterRoot.position.z,waypointDistance=Math.hypot(wx,wz);
   if(waypointDistance<.12){monsterPathIndex++;continue;}
   const step=Math.min(remaining,.08,waypointDistance),nextX=monsterRoot.position.x+wx/waypointDistance*step,nextZ=monsterRoot.position.z+wz/waypointDistance*step;
   if(monsterBlocked(nextX,nextZ)){pathRefresh=0;break;}
   monsterRoot.position.x=nextX;monsterRoot.position.z=nextZ;remaining-=step;
  }
 }
 if(distance>0.001)monsterRoot.rotation.y=Math.atan2(dx,dz);
 monsterBody.position.y=2.15+Math.sin(time*5)*.07;
 monsterBody.rotation.z=Math.sin(time*3.2)*.045;
 const moved=Math.hypot(monsterRoot.position.x-startX,monsterRoot.position.z-startZ)>0.01;
 if(moved)monsterWalkPhase+=dt*5.5;
 monsterLimbActivity+=(Number(moved)-monsterLimbActivity)*Math.min(1,dt*8);
 for(const limb of monsterLimbs){
  const swing=Math.sin(monsterWalkPhase+limb.phase)*monsterLimbActivity;
  limb.pivot.rotation.x=swing*.48;
  limb.pivot.rotation.z=Math.cos(monsterWalkPhase+limb.phase)*.12*monsterLimbActivity;
  limb.joint.rotation.x=Math.max(0,-swing)*.35;
 }
 if(monsterMode==='hunt'&&!onRaisedBlock&&!monsterCaught&&distance<1.55){monsterCaught=true;document.querySelector('#caught').classList.add('show');document.exitPointerLock?.();}
}
let fpsFrames=0,fpsLast=performance.now();
function frame(){
 requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.033);grounded=isGrounded();
 fpsFrames++;const fpsNow=performance.now();if(fpsNow-fpsLast>=500){document.querySelector('#fps').textContent=`FPS ${Math.round(fpsFrames*1000/(fpsNow-fpsLast))}`;fpsFrames=0;fpsLast=fpsNow;}if(!monsterCaught)update(dt);world.step(1/60,dt,5);keepCrouchedOnPlatform();
 player.position.x=THREE.MathUtils.clamp(player.position.x,-43.7,43.7);player.position.z=THREE.MathUtils.clamp(player.position.z,-73.7,73.7);
 if(!levelCompleted&&Math.abs(player.position.x)<2.4&&player.position.z<-71.2&&player.position.y>1.2){levelCompleted=true;document.querySelector('#completed').classList.add('show');document.exitPointerLock?.();}
 const waterTime=clock.elapsedTime,positions=water.geometry.attributes.position;
 for(let i=0;i<positions.count;i++){const x=waterBase[i*3],z=waterBase[i*3+2];positions.array[i*3+1]=waterBase[i*3+1]+.018*Math.sin(x*.48+waterTime*1.4)*Math.cos(z*.36-waterTime)+.012*Math.sin((x+z)*.72-waterTime*1.8);}
 positions.needsUpdate=true;if((fpsFrames%3)===0)water.geometry.computeVertexNormals();updateMonster(dt,waterTime);
 const horizontalSpeed=Math.hypot(player.velocity.x,player.velocity.z);
 const bobStrength=grounded?Math.min(horizontalSpeed/8,1):0;
 const bobPhase=waterTime*13;
 const bob=Math.abs(Math.sin(bobPhase))*.2*bobStrength;
 const sway=Math.sin(bobPhase*.5)*.1*bobStrength;
 camera.position.set(player.position.x+right.x*sway,player.position.y+(crouched?0.16:eyeHeight)+bob,player.position.z+right.z*sway);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
 renderer.render(scene,camera);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
